version: "2"

run:
  timeout: 5m
  go: "1.25"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
    - misspell
    - gosec
    - bodyclose
    - contextcheck
    - gocritic
    - nilerr

  settings:
    revive:
      rules:
        - name: exported
          severity: warning
          disabled: false
    gosec:
      excludes:
        - G104  # 与 errcheck 重复

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

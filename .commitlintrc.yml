extends:
  - "@commitlint/config-conventional"
rules:
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - refactor
      - test
      - docs
      - chore
      - ci
      - perf
      - style
      - build
      - revert
  scope-empty:
    - 2
    - never
  subject-case:
    - 0
  header-max-length:
    - 2
    - always
    - 120
